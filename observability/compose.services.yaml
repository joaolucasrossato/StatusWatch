# Shared service definitions; use the root Compose entrypoints.
services:
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    entrypoint: [/bin/sh, /etc/prometheus/start.sh]
    environment:
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - node-exporter:${NODE_EXPORTER_LISTEN_ADDRESS:?Set Docker bridge gateway in .env}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager, --cluster.listen-address=]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [observability]

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a unique Grafana password in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    # Host network is needed for actual host network counters, not the container's.
    # Bind only the Docker bridge address, never the host's external interfaces.
    network_mode: host
    pid: host
    command:
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:?Set Docker bridge gateway in .env}:9100
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.netdev
      - --collector.uname
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containerd)($|/)
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker.*|lo)$$
    volumes:
      - /:/host:ro,rslave
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://${NODE_EXPORTER_LISTEN_ADDRESS}:9100/metrics']
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    cgroup: host
    # Required to traverse other containers' non-world-readable writable layers.
    cap_add: [DAC_READ_SEARCH]
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=oom_event,advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/containerd/containerd.sock
        target: /run/containerd/containerd.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKER_ROOT_DIR:-/var/lib/docker}
        target: /var/lib/docker
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [observability]
