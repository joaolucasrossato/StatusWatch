global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

storage:
  tsdb:
    retention:
      time: 35d
      size: 2GB

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:9101']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
