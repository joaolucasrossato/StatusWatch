name: statuswatch

x-backend: &backend
  build: ./backend
  environment:
    APP_NAME: ${APP_NAME:-StatusWatch}
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env and configure DATABASE_URL}
    REDIS_URL: ${REDIS_URL:?Configure REDIS_URL in .env}
    JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-10}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
    WORKER_MAX_REDIRECTS: ${WORKER_MAX_REDIRECTS:-5}
    WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-30}
    NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - statuswatch

services:
  db:
    image: postgres:17-alpine
    container_name: statuswatch-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-statuswatch}
      POSTGRES_USER: ${POSTGRES_USER:-statuswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - statuswatch

  redis:
    image: redis:7.4-alpine
    container_name: statuswatch-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - statuswatch

  api:
    <<: *backend
    container_name: statuswatch-api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 15s

  worker:
    <<: *backend
    container_name: statuswatch-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 15s

  web:
    build: ./frontend
    container_name: statuswatch-web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - statuswatch

volumes:
  postgres_data:

networks:
  statuswatch:
    driver: bridge
